  rateLimitExceededWhatDoesErrorMean: 這個錯誤是什麼意思？
  rateLimitExceededErrorMeaning: 這個頁面透過 GitHub API 取得各服務的即時狀態。GitHub 預設每個 IP 位址每小時 60 次查詢，你已經用完了。
  rateLimitExceededErrorHowCanFix: 要怎麼解決？
  rateLimitExceededErrorFix: 等一個小時，你的 IP 位址額度就會恢復。或者填入你自己的 GitHub 個人存取權杖，每小時可再多 5,000 次查詢。
  rateLimitExceededGeneratePAT: 如何產生個人存取權杖
  rateLimitExceededHasSet: 你已經設定了個人存取權杖。
