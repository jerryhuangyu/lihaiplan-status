owner: jerryhuangyu
repo: lihaiplan-status

# One row per hostname, named hostname-first.
#
# The reader arriving here has one piece of information: the address that would
# not open. Every name therefore starts with the host it answers for, so the
# match is a scan down the left edge rather than a translation exercise. What
# the reader was doing follows the separator, because a hostname alone does not
# say whether it matters to them.
#
# There used to be a fourth row, https://drafts.jenlihai.website/healthz. It is
# gone, and the reason is architectural rather than cosmetic: lihaiplan's README
# has plan.* and drafts.* served by the SAME container, routed on the Host
# header. That check and the plan.* one below interrogate one process, so they
# can barely disagree — the page showed two rows, near-identical numbers, both
# with 計畫 in the name, and no way for a reader to tell which was theirs.
#
# The canary subsumes it. It is also a request to drafts.jenlihai.website, over
# the same DNS, TLS, proxy and Host routing, and then keeps going into storage.
# Three rows still separate every failure worth separating:
#
#   container dead     drafts red, plan red
#   object store dead  drafts red, plan green   ← the one that matters most
#   auth dead          drafts green, plan green, 登入 red
#
# `slug` is pinned on every row. Upptime derives it from `name` (getSiteSlug in
# uptime-monitor), and it is both the history/*.yml filename and the label that
# ties an incident issue to its monitor. Renaming without pinning would orphan
# the history and detach issue #1 — the deliberate break, and the only evidence
# this page has that its alerting actually fires. So the slugs below still read
# like the old names on disk. That mismatch is the price and it is worth it.
sites:
  # 這一條走完 DNS → TLS → 反向代理 → app → Postgres → MinIO → 真的位元組，
  # 是唯一能證明「讀者現在打得開計畫」的檢查。/healthz 只證明行程活著：
  # 物件儲存壞掉時其他兩條會全綠，而所有讀者都拿不到內容。
  #
  # 這份 canary 計畫永遠不要刪、不要 disable。刪掉之後這裡會變成永久紅燈，
  # 而那個紅燈跟服務的真實狀態無關。原始檔在本 repo 的 status-canary.html。
  #   npx lihaiplan upload ./status-canary.html --draft 5c5fg2jasp2h
  - name: drafts.jenlihai.website · 開啟計畫連結
    slug: 讀取一份真實計畫
    url: https://drafts.jenlihai.website/d/5c5fg2jasp2h
    __dangerous__body_down_if_text_missing: "canary-ok"
  - name: plan.jenlihai.website · 儀表板與 API
    slug: api
    url: https://plan.jenlihai.website/healthz
  - name: auth.jenlihai.website · 登入
    slug: 登入
    url: https://auth.jenlihai.website/healthz

status-website:
  cname: status.jenlihai.website
  name: lihaiplan
  introTitle: lihaiplan 服務狀態
  # Two sentences, in the order the reader needs them: how to use the page, then
  # why they can believe it. The first is the whole point — the names below only
  # work as an index if someone says out loud that they are an index.
  introMessage: 打不開的網址是哪個開頭，就看下面對應的那一列。這一頁跑在 GitHub 上，和 lihaiplan 的主機無關。
  # assets/ is copied to the site root, so assets/lihaiplan.css is served from
  # here. Replaces `theme: dark` — the built-in themes are single-mode, and
  # every other lihaiplan surface follows the reader's system setting.
  #
  # post-process.ts runs that copy AFTER `sapper export`, with fs-extra's
  # default overwrite, so a file in assets/ beats the generator's file of the
  # same name. That is deliberate for three of them, and it is the only way to
  # reach them — none has a config key:
  #
  #   manifest.json   said name "Upptime", theme #333333. Whoever adds this page
  #                   to a phone home screen gets whatever is in here.
  #   logo-192.png    the icons manifest.json points at. Upptime's teal arrow
  #   logo-512.png    until overridden.
  #
  # assets/apple-touch-icon.png needs no override and no link tag: iOS fetches
  # /apple-touch-icon.png by convention, and nothing was there before.
  #
  # The icons are declared `purpose: "any"`, not the `"any maskable"` that
  # lihai-icons/site.webmanifest claims. Measured on icon-192.png: the mark's
  # bounding box reaches 91.7px from centre and the maskable safe circle is
  # 76.8px, so a launcher taking the spec at its word crops the outer corners
  # off the L and the H. Under "any" it gets letterboxed instead.
  themeUrl: https://status.jenlihai.website/lihaiplan.css

  # The LH mark. Source of truth is the lihai-icons repo; lihaiplan's own
  # packages/web/public carries the same bytes. Everything under assets/ is
  # copied from there byte-for-byte and never hand-edited, so drift is a
  # `cmp` away rather than something you have to eyeball:
  #
  #   assets/favicon.svg          == lihai-icons/favicon.svg
  #   assets/lihaiplan-192.png    == lihai-icons/icon-192.png
  #   assets/logo-192.png         == lihai-icons/icon-192.png
  #   assets/logo-512.png         == lihai-icons/icon-512.png
  #   assets/apple-touch-icon.png == lihai-icons/apple-touch-icon.png
  #
  # assets/lihai-mark.svg is the one exception, and it is derived rather than
  # authored, by exactly one deletion:
  #
  #   sed '/prefers-color-scheme/d' assets/favicon.svg > assets/lihai-mark.svg
  #
  # so `diff` between the two must show that single line and nothing else. It
  # exists because favicon.svg flips to #fafafa in dark mode — right for a tab,
  # fatal in the navbar, which is pinned #faec32 in both themes: white on that
  # yellow is 1.08:1 and the mark would simply vanish for half the readers.
  # Same trap as the navbar text colour pinned in assets/lihaiplan.css.
  #
  # Neither key below is documented on upptime.js.org — both are read straight
  # from src/routes/_layout.svelte in upptime/status-page. Without them the tab
  # shows Upptime's logo, fetched from raw.githubusercontent.com, which is both
  # off-brand and the only request this page makes to a host we do not control.
  faviconSvg: https://status.jenlihai.website/favicon.svg
  favicon: https://status.jenlihai.website/lihaiplan-192.png

  # src/components/Nav.svelte wraps the logo in a link and, unless hideNavTitle
  # is set, prints `name` beside it inside that same link. hideNavTitle is
  # tempting here and is a trap: Nav.svelte hard-codes alt="" on the image, so
  # hiding the title leaves an <a> with no accessible name at all — a screen
  # reader announces an empty link in the masthead. There is no config key for
  # alt text and no way to reach it from CSS, so the title stays.
  #
  # Which made the second navbar item's old title, lihaiplan, a duplicate of
  # the word now sitting on the left of the same bar, pointing somewhere else.
  # It is 儀表板 instead — which is what it actually opens, and matches the name
  # of the monitor watching it above.
  logoUrl: https://status.jenlihai.website/lihai-mark.svg

  navbar:
    - title: 狀態
      href: /
    - title: 儀表板
      href: https://plan.jenlihai.website

# Merged over upptime/status-page's i18n.yml, key by key, so anything left out
# here keeps the upstream English rather than breaking. Everything the page can
# actually put in front of a reader is translated below, including the
# rate-limit screen: this page calls the GitHub API from the browser, 60
# requests per hour per IP, and an office behind one address during an outage
# is exactly when a wall of unexpected English is least welcome.
#
# `locale` is not decoration. Incidents.svelte passes it to toLocaleDateString,
# so it is what turns 8/16/2026 into 2026/8/16.
#
# $UPTIME and $TIME are not substituted — LiveStatus.svelte SPLITS on them and
# renders the number between the halves. So text may move around a placeholder
# but the token itself has to survive verbatim, and a string that drops it
# loses the number entirely. The strings are also injected with {@html}: no
# escaping to worry about, and no stray angle brackets allowed either.
i18n:
  locale: zh-TW

  liveStatus: 目前狀態
  allSystemsOperational: 所有服務正常
  overallUptime: "可用率：$UPTIME"
  overallUptimeTitle: 可用率
  averageResponseTime: "平均回應時間：$TIME ms"
  averageResponseTimeTitle: 平均回應時間
  sevelDayResponseTime: 七天回應時間
  responseTimeMs: 回應時間（毫秒）
  up: 正常
  down: 中斷
  degraded: 緩慢
  ms: 毫秒
  loading: 載入中

  duration24H: 24 小時
  duration7D: 7 天
  duration30D: 30 天
  duration1Y: 1 年
  durationAll: 全部

  activeIncidents: 進行中的事件
  pastIncidents: 過去的事件
  activeIncidentSummary: $DATE 開啟，共 $POSTS 則更新
  pastIncidentsResolved: $MINUTES 分鐘內解決，共 $POSTS 則更新
  incidentReport: "事件 #$NUMBER 報告 →"
  incidentTitle: 事件 $NUMBER 詳情
  incidentDetails: 事件詳情
  incidentFixed: 已修復
  incidentOngoing: 進行中
  incidentOpenedAt: 開啟於
  incidentClosedAt: 關閉於
  incidentViewOnGitHub: 在 GitHub 上查看並訂閱
  incidentCommentSummary: $AUTHOR 於 $DATE 發佈
  incidentBack: ← 回到所有事件

  scheduledMaintenance: 排定的維護
  pastScheduledMaintenance: 過去的維護
  scheduledMaintenanceSummaryStarted: $DATE 開始，持續 $DURATION 分鐘
  scheduledMaintenanceSummaryStarts: $DATE 開始，持續 $DURATION 分鐘
  startedAt: 開始於
  startsAt: 開始於
  duration: 持續時間
  durationMin: $DURATION 分鐘
  incidentCompleted: 已完成
