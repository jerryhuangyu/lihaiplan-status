owner: jerryhuangyu
repo: lihaiplan-status

sites:
  - name: 已發佈的計畫
    url: https://drafts.jenlihai.website/healthz
  # 這一條走完 DNS → TLS → 反向代理 → app → Postgres → MinIO → 真的位元組，
  # 是唯一能證明「讀者現在打得開計畫」的檢查。/healthz 只證明行程活著：
  # 物件儲存壞掉時其他三條會全綠，而所有讀者都拿不到內容。
  #
  # 這份 canary 計畫永遠不要刪、不要 disable。刪掉之後這裡會變成永久紅燈，
  # 而那個紅燈跟服務的真實狀態無關。原始檔在本 repo 的 status-canary.html。
  #   npx lihaiplan upload ./status-canary.html --draft 5c5fg2jasp2h
  - name: 讀取一份真實計畫
    url: https://drafts.jenlihai.website/d/5c5fg2jasp2h
    __dangerous__body_down_if_text_missing: "canary-ok"
  - name: 儀表板與 API
    url: https://plan.jenlihai.website/healthz
  - name: 登入
    url: https://auth.jenlihai.website/healthz

status-website:
  cname: status.jenlihai.website
  name: lihaiplan
  introTitle: lihaiplan 服務狀態
  introMessage: 這一頁跑在 GitHub 上，和 lihaiplan 的主機無關。
  # assets/ is copied to the site root as-is, so assets/lihaiplan.css is served
  # from here. Replaces `theme: dark` — the built-in themes are single-mode, and
  # every other lihaiplan surface follows the reader's system setting.
  themeUrl: https://status.jenlihai.website/lihaiplan.css

  # lihaiplan's own mark, copied from packages/web/public/favicon.svg. Not
  # documented on upptime.js.org — the keys are read straight from
  # src/routes/_layout.svelte in upptime/status-page. Without them the tab shows
  # Upptime's logo, fetched from raw.githubusercontent.com, which is both
  # off-brand and the only request this page makes to a host we do not control.
  # The PNG is not named logo-192.png on purpose: that name already exists at
  # the site root and belongs to the generator.
  faviconSvg: https://status.jenlihai.website/favicon.svg
  favicon: https://status.jenlihai.website/lihaiplan-192.png
  navbar:
    - title: 狀態
      href: /
    - title: lihaiplan
      href: https://plan.jenlihai.website
