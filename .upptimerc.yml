owner: jerryhuangyu
repo: lihaiplan-status

sites:
  - name: 已發佈的計畫
    url: https://drafts.jenlihai.website/healthz
  # 這一條走完 DNS → TLS → 反向代理 → app → Postgres → MinIO → 真的位元組，
  # 是唯一能證明「讀者現在打得開計畫」的檢查。/healthz 只證明行程活著：
  # 物件儲存壞掉時其他三條會全綠，而所有讀者都拿不到內容。
  #
  # 這份 canary 計畫永遠不要刪、不要 disable。刪掉之後這裡會變成永久紅燈，
  # 而那個紅燈跟服務的真實狀態無關。原始檔在本 repo 的 status-canary.html。
  #   npx lihaiplan upload ./status-canary.html --draft 5c5fg2jasp2h
  - name: 讀取一份真實計畫
    url: https://drafts.jenlihai.website/d/5c5fg2jasp2h
    __dangerous__body_down_if_text_missing: "canary-ok"
  - name: 儀表板與 API
    url: https://plan.jenlihai.website/healthz
  - name: 登入
    url: https://auth.jenlihai.website/healthz

status-website:
  cname: status.jenlihai.website
  name: lihaiplan
  introTitle: lihaiplan 服務狀態
  introMessage: 這一頁跑在 GitHub 上，和 lihaiplan 的主機無關。
  # assets/ is copied to the site root, so assets/lihaiplan.css is served from
  # here. Replaces `theme: dark` — the built-in themes are single-mode, and
  # every other lihaiplan surface follows the reader's system setting.
  #
  # post-process.ts runs that copy AFTER `sapper export`, with fs-extra's
  # default overwrite, so a file in assets/ beats the generator's file of the
  # same name. That is deliberate for three of them, and it is the only way to
  # reach them — none has a config key:
  #
  #   manifest.json   said name "Upptime", theme #333333. Whoever adds this page
  #                   to a phone home screen gets whatever is in here.
  #   logo-192.png    the icons manifest.json points at. Upptime's teal arrow
  #   logo-512.png    until overridden.
  #
  # assets/apple-touch-icon.png needs no override and no link tag: iOS fetches
  # /apple-touch-icon.png by convention, and nothing was there before.
  #
  # The icons are declared `purpose: "any"`, not the `"any maskable"` that
  # lihai-icons/site.webmanifest claims. Measured on icon-192.png: the mark's
  # bounding box reaches 91.7px from centre and the maskable safe circle is
  # 76.8px, so a launcher taking the spec at its word crops the outer corners
  # off the L and the H. Under "any" it gets letterboxed instead.
  themeUrl: https://status.jenlihai.website/lihaiplan.css

  # The LH mark. Source of truth is the lihai-icons repo; lihaiplan's own
  # packages/web/public carries the same bytes. Everything under assets/ is
  # copied from there byte-for-byte and never hand-edited, so drift is a
  # `cmp` away rather than something you have to eyeball:
  #
  #   assets/favicon.svg          == lihai-icons/favicon.svg
  #   assets/lihaiplan-192.png    == lihai-icons/icon-192.png
  #   assets/logo-192.png         == lihai-icons/icon-192.png
  #   assets/logo-512.png         == lihai-icons/icon-512.png
  #   assets/apple-touch-icon.png == lihai-icons/apple-touch-icon.png
  #
  # assets/lihai-mark.svg is the one exception, and it is derived rather than
  # authored, by exactly one deletion:
  #
  #   sed '/prefers-color-scheme/d' assets/favicon.svg > assets/lihai-mark.svg
  #
  # so `diff` between the two must show that single line and nothing else. It
  # exists because favicon.svg flips to #fafafa in dark mode — right for a tab,
  # fatal in the navbar, which is pinned #faec32 in both themes: white on that
  # yellow is 1.08:1 and the mark would simply vanish for half the readers.
  # Same trap as the navbar text colour pinned in assets/lihaiplan.css.
  #
  # Neither key below is documented on upptime.js.org — both are read straight
  # from src/routes/_layout.svelte in upptime/status-page. Without them the tab
  # shows Upptime's logo, fetched from raw.githubusercontent.com, which is both
  # off-brand and the only request this page makes to a host we do not control.
  faviconSvg: https://status.jenlihai.website/favicon.svg
  favicon: https://status.jenlihai.website/lihaiplan-192.png

  # src/components/Nav.svelte wraps the logo in a link and, unless hideNavTitle
  # is set, prints `name` beside it inside that same link. hideNavTitle is
  # tempting here and is a trap: Nav.svelte hard-codes alt="" on the image, so
  # hiding the title leaves an <a> with no accessible name at all — a screen
  # reader announces an empty link in the masthead. There is no config key for
  # alt text and no way to reach it from CSS, so the title stays.
  #
  # Which made the second navbar item's old title, lihaiplan, a duplicate of
  # the word now sitting on the left of the same bar, pointing somewhere else.
  # It is 儀表板 instead — which is what it actually opens, and matches the name
  # of the monitor watching it above.
  logoUrl: https://status.jenlihai.website/lihai-mark.svg

  navbar:
    - title: 狀態
      href: /
    - title: 儀表板
      href: https://plan.jenlihai.website
